name: Strava Travel → GeoJSON/Shapefile
on:
  schedule:
    - cron: '17 4 * * *'   # daily at 04:17 UTC (fixed the cron syntax)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch_travel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run travel fetcher
        env:
          TRAVEL_CLIENT_ID: ${{ secrets.TRAVEL_CLIENT_ID }}
          TRAVEL_CLIENT_SECRET: ${{ secrets.TRAVEL_CLIENT_SECRET }}
          TRAVEL_REFRESH_TOKEN: ${{ secrets.TRAVEL_REFRESH_TOKEN }}
        run: |
          python scripts/travel_fetch.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Strava travel data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            # Pull latest changes and rebase our commit on top
            git pull --rebase origin main || git pull --no-rebase origin main
            git push
          fi
